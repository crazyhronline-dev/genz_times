<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gzRimGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="gzGStrokeFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="gzZStrokeFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="gzDiscBgFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <radialGradient id="gzAmbientGlowFav" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Obsidian Chrono Disc -->
  <circle cx="50" cy="50" r="46" fill="url(#gzDiscBgFav)" stroke="#1E293B" stroke-width="1.8" />
  <circle cx="50" cy="50" r="42" fill="url(#gzAmbientGlowFav)" />
  
  <!-- Outer Chrono Precision Arcs -->
  <path d="M 23 18 A 44 44 0 0 1 77 18" stroke="url(#gzRimGradFav)" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M 23 82 A 44 44 0 0 0 77 82" stroke="url(#gzRimGradFav)" stroke-width="2.8" stroke-linecap="round" fill="none" />
  
  <!-- Cardinal Ticks -->
  <line x1="50" y1="7" x2="50" y2="13" stroke="#00F5FF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="87" x2="50" y2="93" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round" />
  <line x1="7" y1="50" x2="13" y2="50" stroke="#00F5FF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="87" y1="50" x2="93" y2="50" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round" />

  <!-- Aerodynamic 'G' -->
  <path d="M 45 31 L 31 31 C 23.5 31 18 36.5 18 44 L 18 56 C 18 63.5 23.5 69 31 69 L 45 69 L 45 52 L 34 52" 
        stroke="url(#gzGStrokeFav)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- High-Velocity 'Z' -->
  <path d="M 55 31 L 82 31 L 56 69 L 83 69" 
        stroke="url(#gzZStrokeFav)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Quantum Node -->
  <circle cx="69" cy="50" r="2.8" fill="#FFFFFF" />
</svg>
